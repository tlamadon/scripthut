# ScriptFlow must already be installed in the compute-node environment.
backends:
  - name: cluster
    type: slurm
    ssh:
      host: hpc-cluster.example.edu
      user: alice
      key_path: ~/.ssh/id_ed25519
      known_hosts: ~/.ssh/known_hosts
    clone_dir: /data/repos
    env_groups:
      scriptflow:
        - init: source /data/venv/bin/activate

scriptflow:
  env_group: scriptflow
  cpus: 1
  memory: 2G
  time_limit: '01:00:00'

sources:
  - name: example
    type: git
    url: https://example.edu/example.git
    branch: main
    clone_dir: /data/repos
    # Default workdir: /data/repos/.worktrees/source-example
    # workdir: /data/example
    flow_dir: .

settings:
  poll_interval: 60
  server_host: 127.0.0.1
  server_port: 8000
  data_dir: ~/.cache/scripthut
