# ScriptFlow must already be installed in the compute-node environment.
backends:
  - name: cluster
    type: slurm
    ssh:
      host: hpc-cluster.example.edu
      user: alice
      key_path: ~/.ssh/id_ed25519
      known_hosts: ~/.ssh/known_hosts
    clone_dir: /data/repos
    # image_dir: /data/images  # default: <backend clone_dir>/images
    # registry_user: alice
    # image_scratch_dir: /tmp  # node-local override; otherwise SLURM_TMPDIR, TMPDIR, /tmp
    # image_pull_timeout_seconds: 600
    # registry_token_file: /data/local-secrets/registry-token
    env_groups:
      scriptflow:
        - init: source /data/venv/bin/activate

scriptflow:
  env_group: scriptflow
  cpus: 1
  memory: 2G
  time_limit: '01:00:00'

sources:
  - name: example
    type: git
    url: https://example.edu/example.git
    branch: main
    clone_dir: /data/repos
    # Default workdir: /data/repos/.worktrees/source-example
    # workdir: /data/example
    flow_dir: .
    # images:
    #   - name: app
    #     ref_file: image.ref  # committed registry reference pinned by sha256 digest

settings:
  fetch_max_file_bytes: 1073741824  # 1 GiB
  fetch_max_total_bytes: 10737418240  # 10 GiB
  poll_interval: 60
  # Web: / overview, /runs, /sources (launch), /disk (read-only).
  server_host: 127.0.0.1
  server_port: 8000
  data_dir: ~/.cache/scripthut
