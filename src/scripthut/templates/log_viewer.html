{% from '_status.html' import status_dot %}
<!DOCTYPE html>
<html lang="en" style="scrollbar-gutter: stable">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptHut - {{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='25' cy='2' r='1.8' fill='%23ccc' opacity='.5'/%3E%3Ccircle cx='23' cy='5' r='2.2' fill='%23bbb' opacity='.45'/%3E%3Ccircle cx='25.5' cy='8' r='1.8' fill='%23aaa' opacity='.4'/%3E%3Crect x='22' y='7' width='2.5' height='8' fill='%23696969'/%3E%3Cpolygon points='16,3 0,22 32,22' fill='%23B8860B'/%3E%3Cline x1='16' y1='3' x2='3' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='9' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='16' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='23' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='29' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Crect x='6' y='22' width='20' height='8' fill='%23D2B48C'/%3E%3Crect x='12' y='24' width='6' height='6' rx='3' ry='2' fill='%235C3317'/%3E%3Crect x='20' y='25' width='3' height='3' fill='%2387CEEB' stroke='%235C3317' stroke-width='.5'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            {% include "nav.html" %}
        </header>
        <div class="flex gap-4" style="height:calc(100vh - 100px)">
            <div class="w-64 flex-shrink-0 bg-white rounded-lg shadow-md overflow-y-auto">{% include 'run_sidebar.html' %}</div>
            <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                <div class="bg-white rounded-t-lg shadow-md border-b flex items-center justify-between px-4 py-3"><a class="text-blue-600" href="/runs/{{ run.id }}">{{ run.workflow_name }}</a><span>{{ task_name }} · Attempt {{ attempt }}</span></div>
                <div class="bg-gray-50 border-b px-4 py-2 flex items-center gap-3 text-xs">
                    <label>Tail <select id="tail-lines" class="border rounded px-2 py-1">
                        <option value="200">200 lines</option>
                        <option value="1000">1000 lines</option>
                        <option value="0">All (size capped)</option>
                    </select></label>
                    <button onclick="loadLog()" class="px-3 py-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200">Refresh</button>
                </div>
                <pre id="log-content" class="flex-1 overflow-auto bg-gray-900 text-gray-100 text-xs font-mono p-4 whitespace-pre-wrap">Loading log…</pre>
            </div>
        </div>
    </div>
<script>
async function loadLog() {
    const url = new URL({{ log_url|tojson }}, window.location.origin);
    url.searchParams.set('tail', document.getElementById('tail-lines').value);
    try {
        const response = await fetch(url);
        const data = await response.json();
        document.getElementById('log-content').textContent = response.ok ? data.content + (data.truncated ? '\n[truncated]' : '') : data.detail;
    } catch (error) { document.getElementById('log-content').textContent = String(error); }
}
loadLog();
</script>
</body>
</html>
