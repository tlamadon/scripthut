<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScriptHut — Terminals</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/htmx.org@1.9.10"></script><script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script></head><body class="bg-gray-100 text-gray-800"><main class="container mx-auto px-4 py-8">{% include "nav.html" %}<h1 class="text-2xl">Attach to an existing tmux session</h1><form id="attach" class="space-y-3"><label>Backend <select name="backend">{% for name in backends %}<option>{{ name }}</option>{% endfor %}</select></label><label>Compute host <input name="node" required></label><label>tmux session <input name="session" required></label><button class="border p-2">Attach</button></form><p>Attaching does not request an allocation or create a session.</p><script>document.getElementById('attach').onsubmit = function(e) { e.preventDefault(); const f = new FormData(this); location.href = '/terminal/' + encodeURIComponent(f.get('backend')) + '?session_type=job&node=' + encodeURIComponent(f.get('node')) + '&session=' + encodeURIComponent(f.get('session')); };</script></main></body></html>
