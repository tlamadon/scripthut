<!DOCTYPE html>
<html lang="en" style="scrollbar-gutter: stable">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptHut - Runs</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='25' cy='2' r='1.8' fill='%23ccc' opacity='.5'/%3E%3Ccircle cx='23' cy='5' r='2.2' fill='%23bbb' opacity='.45'/%3E%3Ccircle cx='25.5' cy='8' r='1.8' fill='%23aaa' opacity='.4'/%3E%3Crect x='22' y='7' width='2.5' height='8' fill='%23696969'/%3E%3Cpolygon points='16,3 0,22 32,22' fill='%23B8860B'/%3E%3Cline x1='16' y1='3' x2='3' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='9' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='16' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='23' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Cline x1='16' y1='3' x2='29' y2='22' stroke='%23A07000' stroke-width='.7'/%3E%3Crect x='6' y='22' width='20' height='8' fill='%23D2B48C'/%3E%3Crect x='12' y='24' width='6' height='6' rx='3' ry='2' fill='%235C3317'/%3E%3Crect x='20' y='25' width='3' height='3' fill='%2387CEEB' stroke='%235C3317' stroke-width='.5'/%3E%3C/svg%3E">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Selection affordances are off until the user asks for them.
           Driven entirely by .select-mode on #runs-panel rather than by
           toggling Tailwind's `hidden`/`flex` together, whose winner would
           depend on the order those utilities happen to be emitted in. */
        #select-bar { display: none; }
        #runs-panel.select-mode #select-bar { display: flex; }
        #runs-panel.select-mode #select-btn { display: none; }
        .run-select-cell { display: none; }
        #runs-panel.select-mode .run-select-cell { display: table-cell; }
        #runs-panel.select-mode span.run-select-cell { display: flex; align-items: center; }
        /* In select mode the list is for picking, not navigating — otherwise
           a click aimed at a row lands on a link and leaves the page. */
        #runs-panel.select-mode #runs-list a { pointer-events: none; }
        #runs-panel.select-mode .run-delete-btn { display: none; }
        #runs-panel.select-mode [data-run-id] { cursor: pointer; }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            {% include "nav.html" %}
        </header>

        <!-- Error banner (hidden by default) -->
        <div id="run-error" class="hidden bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded mb-6">
            <span class="font-medium">Error:</span> <span id="run-error-msg"></span>
        </div>

        <!-- Runs List (SSE-connected) -->
        <div hx-ext="sse" sse-connect="/runs/stream">
            {# `runs-panel` carries the select-mode class: it sits OUTSIDE
               #runs-list, which the SSE stream replaces wholesale, so the
               mode survives a live refresh mid-selection. #}
            <div id="runs-panel" class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="px-6 py-4 bg-gray-50 border-b flex items-center justify-between gap-3">
                    <h2 class="text-xl font-semibold text-gray-800">Runs</h2>
                    <div class="flex items-center gap-2">
                        <button id="select-btn" type="button" onclick="setSelectMode(true)"
                            class="text-sm px-3 py-1.5 rounded-md bg-white border border-gray-300 text-gray-700 hover:bg-gray-50">
                            Select
                        </button>
                        <div id="select-bar" class="items-center gap-2">
                            <span id="select-count" class="text-sm text-gray-600 tabular-nums">0 selected</span>
                            <button type="button" onclick="selectAll()"
                                class="text-sm px-2 py-1.5 rounded-md text-blue-600 hover:bg-blue-50">All</button>
                            <button type="button" onclick="selectNone()"
                                class="text-sm px-2 py-1.5 rounded-md text-blue-600 hover:bg-blue-50">None</button>
                            <button id="delete-selected" type="button"
                                hx-post="/runs/delete"
                                hx-include="#runs-list"
                                hx-target="#runs-list"
                                hx-swap="innerHTML"
                                hx-confirm="Delete the selected runs? This cannot be undone."
                                class="text-sm px-3 py-1.5 rounded-md bg-red-600 text-white hover:bg-red-700 disabled:bg-gray-300 disabled:cursor-not-allowed"
                                disabled>
                                Delete
                            </button>
                            <button type="button" onclick="setSelectMode(false)"
                                class="text-sm px-3 py-1.5 rounded-md bg-white border border-gray-300 text-gray-700 hover:bg-gray-50">
                                Done
                            </button>
                        </div>
                    </div>
                </div>
                <div id="runs-list" sse-swap="runs-update" hx-swap="innerHTML">
                    {% include "runs_list.html" %}
                </div>
            </div>
        </div>
    </div>

    <script>
        // Convert UTC <time> elements to browser local time
        function formatLocalTimes(root) {
            (root || document).querySelectorAll('time.local-time').forEach(function(el) {
                if (el.dataset.converted) return;
                var dt = new Date(el.getAttribute('datetime'));
                if (isNaN(dt)) return;
                var fmt = el.dataset.format || 'datetime';
                if (fmt === 'time') {
                    el.textContent = dt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
                } else if (fmt === 'datetime-seconds') {
                    el.textContent = dt.toLocaleDateString([], {year: 'numeric', month: '2-digit', day: '2-digit'}) + ' ' + dt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
                } else {
                    el.textContent = dt.toLocaleDateString([], {year: 'numeric', month: '2-digit', day: '2-digit'}) + ' ' + dt.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                }
                el.dataset.converted = '1';
            });
        }
        formatLocalTimes();
        document.body.addEventListener('htmx:afterSwap', function(e) { formatLocalTimes(e.detail.target); });
        new MutationObserver(function() { formatLocalTimes(); applySelection(); }).observe(
            document.getElementById('runs-list') || document.body, { childList: true, subtree: true }
        );

        // --- Bulk selection -------------------------------------------------
        // The selected ids live here rather than in the DOM: /runs/stream
        // replaces the whole list on every poll, which would otherwise clear
        // a selection the moment the page refreshed under the user.
        var selectMode = false;
        var selectedIds = new Set();

        function setSelectMode(on) {
            selectMode = on;
            document.getElementById('runs-panel').classList.toggle('select-mode', on);
            if (!on) selectedIds.clear();
            applySelection();
        }

        function applySelection() {
            var boxes = document.querySelectorAll('#runs-list .run-checkbox');
            // Drop ids that are no longer listed (deleted, or aged out of a
            // refresh) so the count never claims more than is selectable.
            var present = new Set();
            boxes.forEach(function (b) { present.add(b.value); });
            selectedIds.forEach(function (id) { if (!present.has(id)) selectedIds.delete(id); });

            boxes.forEach(function (b) {
                var want = selectedIds.has(b.value);
                if (b.checked !== want) b.checked = want;
            });

            var n = selectedIds.size;
            document.getElementById('select-count').textContent = n + ' selected';
            var del = document.getElementById('delete-selected');
            del.disabled = n === 0;
            del.setAttribute(
                'hx-confirm',
                'Delete ' + n + ' run' + (n === 1 ? '' : 's') + '? This cannot be undone.'
            );
        }

        function selectAll() {
            document.querySelectorAll('#runs-list .run-checkbox').forEach(function (b) {
                selectedIds.add(b.value);
            });
            applySelection();
        }

        function selectNone() {
            selectedIds.clear();
            applySelection();
        }

        // Delegated so the handlers survive the list being swapped out.
        var runsList = document.getElementById('runs-list');
        runsList.addEventListener('change', function (e) {
            var box = e.target.closest('.run-checkbox');
            if (!box) return;
            if (box.checked) selectedIds.add(box.value); else selectedIds.delete(box.value);
            applySelection();
        });

        // Anywhere on a row toggles it — the checkbox is a small target and
        // the point of this mode is clearing many runs quickly.
        runsList.addEventListener('click', function (e) {
            if (!selectMode || e.target.closest('.run-checkbox')) return;
            var row = e.target.closest('[data-run-id]');
            if (!row) return;
            var box = row.querySelector('.run-checkbox');
            if (!box) return;  // active run: nothing to select
            e.preventDefault();
            if (selectedIds.has(box.value)) selectedIds.delete(box.value);
            else selectedIds.add(box.value);
            applySelection();
        });

        document.getElementById('delete-selected').addEventListener('htmx:afterRequest', function (e) {
            if (e.detail.successful) setSelectMode(false);
        });

        function handleRunResponse(event) {
            if (event.detail.successful) {
                window.location.reload();
            } else {
                var errorBanner = document.getElementById('run-error');
                var errorMsg = document.getElementById('run-error-msg');
                try {
                    var resp = JSON.parse(event.detail.xhr.responseText);
                    errorMsg.textContent = resp.error || 'Unknown error';
                } catch (e) {
                    errorMsg.textContent = 'Request failed (HTTP ' + event.detail.xhr.status + ')';
                }
                errorBanner.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    </script>
</body>

</html>
